name: Weekly Scrape

on:
  schedule:
    - cron: '0 10 * * 2'   # Every Tuesday, 10:00 UTC
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly scrape
        env:
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
        run: python main.py

      - name: Upload matches.json
        uses: actions/upload-artifact@v4
        with:
          name: weekly-matches-json
          path: output/matches.json
          if-no-files-found: error
